apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
  namespace: ecommerce-backend-ns
  labels:
    app: ecommerce-backend
    environment: production
    version: v1.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
        environment: production
    spec:
      serviceAccountName: backend-auth-sa  # Required for IRSA to access AWS Secrets Manager
      containers:
      - name: ecommerce-backend
        image: /ecommerce/backend:dev-4
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # Load all non-sensitive config from ConfigMap
        envFrom:
        - configMapRef:
            name: backend-config

        # Load sensitive data from Secret
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SECRET_KEY

        # Optional: If NOT using IRSA, uncomment to load AWS credentials from Secret
        # - name: AWS_ACCESS_KEY_ID
        #   valueFrom:
        #     secretKeyRef:
        #       name: backend-secrets
        #       key: AWS_ACCESS_KEY_ID
        # - name: AWS_SECRET_ACCESS_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: backend-secrets
        #       key: AWS_SECRET_ACCESS_KEY

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /admin/  # Django admin endpoint (returns 302 which is OK)
            port: 8000
          initialDelaySeconds: 60  # Increased for DB connection + migrations
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /admin/  # Django admin endpoint
            port: 8000
          initialDelaySeconds: 30  # Increased for startup time
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true  # Matches Dockerfile USER appuser
          runAsUser: 1000      # appuser UID from Dockerfile
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL