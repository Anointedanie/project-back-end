apiVersion: v1
kind: Service
metadata:
  name: ecommerce-backend-svc
  namespace: ecommerce-backend-ns
  labels:
    app: ecommerce-backend
spec:
  type: ClusterIP  # Changed from LoadBalancer - nginx ingress will handle it
  selector:
    app: ecommerce-backend
  ports:
  - name: http
    port: 80
    targetPort: 8000  # Your Django backend runs on 8000
    protocol: TCP
  sessionAffinity: None
