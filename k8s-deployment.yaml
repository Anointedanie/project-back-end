---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: ecommerce
data:
  # Django settings
  DEBUG: "False"
  ALLOWED_HOSTS: "your-domain.com,api.your-domain.com"

  # JWT settings
  JWT_ACCESS_TOKEN_LIFETIME: "60"
  JWT_REFRESH_TOKEN_LIFETIME: "1440"

  # CORS settings
  CORS_ALLOWED_ORIGINS: "https://your-frontend.com,https://www.your-frontend.com"

  # AWS settings
  AWS_SECRET_NAME: "ecommerce2"
  AWS_REGION: "us-east-1"
  USE_AWS_SECRETS: "True"

  # Entrypoint script settings
  RUN_MIGRATIONS: "true"
  COLLECT_STATIC: "true"
  WAIT_FOR_DB: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Django secret key - Generate a new one for production!
  SECRET_KEY: "your-super-secret-key-change-this-in-production"

  # Optional: Database credentials (if not using AWS Secrets Manager)
  # DB_NAME: "postgres"
  # DB_USER: "chris"
  # DB_PASSWORD: "your-password"
  # DB_HOST: "100.25.193.255"
  # DB_PORT: "5432"

---
# ServiceAccount for AWS IAM Role (if using IRSA on EKS)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: django-app
  namespace: ecommerce
  annotations:
    # For AWS EKS with IAM Roles for Service Accounts (IRSA)
    eks.amazonaws.com/role-arn: arn:aws:iam::793796654438:role/ecommerce-django-role

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: ecommerce
  labels:
    app: django
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: django
      tier: backend
  template:
    metadata:
      labels:
        app: django
        tier: backend
    spec:
      serviceAccountName: django-app

      containers:
      - name: django
        image: your-registry/django-ecommerce:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secrets

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /admin/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /admin/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /admin/
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

      # Optional: Init container for migrations
      initContainers:
      - name: migrate
        image: your-registry/django-ecommerce:latest
        command: ['python', 'manage.py', 'migrate', '--noinput']
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: ecommerce
  labels:
    app: django
spec:
  type: ClusterIP
  selector:
    app: django
    tier: backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress
  namespace: ecommerce
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.your-domain.com
    secretName: django-tls
  rules:
  - host: api.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 8000

---
# Optional: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
